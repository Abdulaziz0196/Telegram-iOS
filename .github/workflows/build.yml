name: Abugram IPA

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: abugram-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            XCODE_APP="/Applications/Xcode_$XCODE_VERSION.app"
          else
            echo "Xcode $XCODE_VERSION not found, available:"; ls -d /Applications/Xcode*.app
            XCODE_APP=$(ls -d /Applications/Xcode_${XCODE_VERSION%%.*}*.app 2>/dev/null | sort -V | tail -1 || true)
          fi
          if [ -z "$XCODE_APP" ]; then
            echo "::error::No Xcode ${XCODE_VERSION%%.*}.x on this runner"; exit 1
          fi
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          sudo chown "$(whoami)" /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Write Abugram configuration
        env:
          ABUGRAM_API_ID: ${{ secrets.ABUGRAM_API_ID }}
          ABUGRAM_API_HASH: ${{ secrets.ABUGRAM_API_HASH }}
        run: |
          cd /Users/Shared/telegram-ios
          python3 - <<'EOF'
          import json, os
          with open("build-system/appstore-configuration.json") as f:
              config = json.load(f)
          # Optional override from Actions secrets; otherwise the committed Abugram keys are used
          if os.environ.get("ABUGRAM_API_ID", "").strip():
              config["api_id"] = os.environ["ABUGRAM_API_ID"].strip()
          if os.environ.get("ABUGRAM_API_HASH", "").strip():
              config["api_hash"] = os.environ["ABUGRAM_API_HASH"].strip()
          with open("build-system/abugram-configuration.json", "w") as f:
              json.dump(config, f, indent=4)
          EOF

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          export APP_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["app"])')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export BUILD_NUMBER="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/abugram-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          IPA=$(ls bazel-bin/Telegram/*.ipa | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa in bazel-bin/Telegram"; exit 1
          fi
          cp "$IPA" "$OUTPUT_PATH/Abugram.ipa"
          ls -lh "$OUTPUT_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Abugram-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts/Abugram.ipa
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: abugram-${{ env.BUILD_NUMBER }}
          name: Abugram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          body: |
            Abugram for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}).
            Unsigned IPA: install with Esign, Scarlet, Sideloadly or AltStore.
          files: /Users/Shared/telegram-ios/build/artifacts/Abugram.ipa
